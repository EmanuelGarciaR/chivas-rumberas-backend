info:
  name: allBookings
  type: http

http:
  method: GET
  url: http://localhost:3000/bookings?page=1&limit=10
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer
    token: TOKEN

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
